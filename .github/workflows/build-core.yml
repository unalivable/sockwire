name: build-sockwire-core

on:
  workflow_dispatch:
  push:
    paths:
      - 'SockWire-Core/**'
      - '.github/workflows/build-core.yml'

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Resolve deps
        working-directory: SockWire-Core
        run: |
          go get github.com/whyvl/wireproxy@latest
          go mod tidy
      - name: gomobile init
        run: gomobile init
      - name: gomobile bind (armv7, API 19)
        working-directory: SockWire-Core
        run: |
          gomobile bind \
            -target=android/arm \
            -androidapi 19 \
            -javapkg=rffrr.sock.wire.core \
            -ldflags='-s -w' \
            -o "$GITHUB_WORKSPACE/sockwire-core.aar" \
            ./mobile
      - uses: actions/upload-artifact@v4
        with:
          name: sockwire-core-aar
          path: sockwire-core.aar
          retention-days: 30
