name: build-sockwire-core

on:
  workflow_dispatch:
  push:
    paths:
      - 'SockWire-Core/**'
      - '.github/workflows/build-core.yml'

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install NDK r25c (Last version supporting API 19)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV

      - name: Resolve Go dependencies
        working-directory: SockWire-Core
        run: |
          go get github.com/octeep/wireproxy@latest
          go mod tidy

      - name: Init gomobile
        run: gomobile init

      - name: Build AAR
        working-directory: SockWire-Core
        run: |
          gomobile bind \
            -target=android/arm \
            -androidapi 19 \
            -javapkg=rffrr.sock.wire.core \
            -ldflags='-s -w' \
            -o "$GITHUB_WORKSPACE/sockwire-core.aar" \
            ./mobile

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sockwire-core-aar
          path: sockwire-core.aar
          retention-days: 30
